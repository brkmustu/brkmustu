name: GitHub İstatistiklerini Ölç ve Kaydet

on:
  schedule:
    - cron: '0 0 * * *' # Her gece 00:00'da otomatik çalışır
  workflow_dispatch: # İstediğin zaman manuel tetikleyebilmen için

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: İstatistikleri Hesapla ve SVG Üret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: python generate_stats.py

      - name: Verileri ve Görseli Depoya Kaydet
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stats-history.json stats-card.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Günlük istatistikler güncellendi" && git push)